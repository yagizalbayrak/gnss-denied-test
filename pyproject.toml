[project]
name = "open-gnss-denied"
version = "0.1.0"
description = "Hybrid AI and factor graph testbed for GNSS-denied navigation on public datasets."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pymap3d>=3.1",
    "pyproj>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["pykitti>=0.3.1"]
backend = ["gtsam>=4.2"]
frontend = [
    "kornia>=0.7",
    "opencv-python>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
]
viz = ["matplotlib>=3.8", "rerun-sdk>=0.18"]
eval = ["evo>=1.28"]
all = ["open-gnss-denied[data,backend,frontend,viz,eval]"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gnss_denied"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
